<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cancionero San Francisco - Chillan</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#0b1e3a;color:#fff}header{padding:16px;text-align:center}.wrap{max-width:700px;margin:0 auto;padding:14px}.card{background:#ffffff14;border:1px solid #ffffff33;border-radius:16px;padding:14px;margin:10px 0}.btn{display:block;background:#ffd500;color:#111;text-align:center;padding:14px;border-radius:12px;font-weight:800;text-decoration:none;margin:10px 0}input{width:100%;padding:12px;border-radius:10px;border:none}</style></head><body><header><div>SAN FRANCISCO DE ASIS - CHILLAN</div><h1>Cancionero</h1></header><div class="wrap"><a class="btn" href="rosario.html">IR AL SANTO ROSARIO CON VOZ</a><div class="card"><input id="busc" placeholder="Buscar cancion..." oninput="filtrar()"><div id="lista"></div></div><div class="card" id="detalle"><b>Toca una cancion para ver su letra</b></div></div><script>const canciones=[{t:"Santo, Santo, Santo",l:"Santo, Santo, Santo es el Senor, Dios del universo."},{t:"Aleluya",l:"Aleluya, aleluya, aleluya."},{t:"Cordero de Dios",l:"Cordero de Dios, que quitas el pecado del mundo, danos la paz."},{t:"Gloria a Dios",l:"Gloria a Dios en el cielo, y en la tierra paz."},{t:"Pescador de Hombres",l:"Tu has venido a la orilla."}];function filtrar(){let q=document.getElementById('busc').value.toLowerCase();let f=canciones.filter(c=>c.t.toLowerCase().includes(q));document.getElementById('lista').innerHTML=f.map(c=>`<div style="padding:12px;cursor:pointer" onclick="ver('${c.t}')"> ${c.t}</div>`).join('');}function ver(t){let c=canciones.find(x=>x.t===t);document.getElementById('detalle').innerHTML='<h2>'+c.t+'</h2><p>'+c.l+'</p>';}filtrar();</script></body></html>
