<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Santo Rosario - Con Voz</title><style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0b1e3a;color:#fff;padding-bottom:90px}header{display:flex;justify-content:space-between;padding:12px 16px;flex-wrap:wrap}.btn{padding:8px 12px;border-radius:20px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;font-weight:700;cursor:pointer}.btnY{background:#ffd500;color:#111;border:none}.wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;max-width:1180px;margin:0 auto;padding:8px 16px}@media(max-width:820px){.wrap{grid-template-columns:1fr}}.card{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:16px;padding:16px}.progress{height:8px;background:#ffffff22;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#ffd500;width:0%}#rosWrap{position:relative;width:100%;max-width:520px;aspect-ratio:0.92;margin:10px auto}.bead{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:2px solid #ffffff22}.bead.ave{width:18px;height:18px;background:#e8a06a}.bead.padre{width:24px;height:24px;background:#f4c27a}.bead.cruz{width:30px;height:30px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center}.bead.done{background:#22c55e!important}.bead.current{outline:3px solid #ffd500}.lbl{position:absolute;font-size:11px;background:#00000055;padding:2px 6px;border-radius:10px}.medal{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);width:26px;height:26px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111}.dayRow{display:flex;gap:4px;flex-wrap:wrap}.dayRow button{flex:1;padding:8px 4px;border-radius:8px;background:#ffffff14;color:#fff;border:1px solid #ffffff22;cursor:pointer}.dayRow button.sel{background:#ffd500;color:#111}.voicebar{background:#00000066;border:1px solid #ffffff33;border-radius:14px;padding:12px;margin-top:10px}select{padding:8px;border-radius:8px;width:100%;margin:4px 0}.bar{position:fixed;bottom:0;left:0;right:0;background:#0b1e3a;border-top:2px solid #ffd500;padding:10px;display:flex;gap:8px;justify-content:center}.bar button{padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;border:none}.pauseBtn{background:#ef4444;color:#fff;flex:1;max-width:340px}.playBtn{background:#22c55e;color:#fff}</style></head><body><header><div><b>El Santo Rosario</b> <span id="fechaTop"></span></div><span>Rosario | Guia | Misterios</span></header><div class="wrap"><div class="card"><div style="background:#ffd500;color:#111;padding:9px;border-radius:10px;font-weight:700;text-align:center;font-size:12px">1 TOQUE = ver + escuchar | DOBLE TOQUE = marcar</div><b>Santo Rosario</b><div style="display:flex;gap:10px;margin-top:8px"><b id="cnt">0 / 61</b><button class="btn" onclick="reiniciar()">Reiniciar</button><button class="btn btnY" onclick="siguiente()">Siguiente</button></div><div class="progress"><div class="fill" id="fill"></div></div><div id="rosWrap"></div><div class="voicebar"><b>VOZ HABLADA + LETRA</b><br><label><input type="checkbox" id="autoVoz" checked> Hablar automaticamente</label><br><label>Voz:</label><select id="voiceSel"></select><label>Velocidad:</label><select id="rateSel"><option value="0.8">Lenta</option><option value="1" selected>Normal</option><option value="1.2">Rapida</option></select><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btnY" onclick="hablarActual()">Reproducir</button><button class="btn" onclick="pausarGeneral()">Pausar</button><button class="btn" onclick="detenerVoz()">Detener</button></div><div id="estadoVoz">Estado: listo</div></div></div><div style="display:flex;flex-direction:column;gap:16px"><div class="card"><div id="hoyTxt"></div><div class="dayRow" id="days"></div><div style="background:#ffffff0d;padding:10px;border-radius:12px;margin-top:8px"><b id="diaMsg"></b><br><b id="diaTipo"></b><div id="diaDesc"></div></div><div id="misteriosList" style="margin-top:10px"></div></div><div class="card"><b id="secTitle">Seccion 1</b><label style="display:flex;gap:8px;margin:10px 0;background:#ffffff14;padding:10px;border-radius:10px"><input type="checkbox" id="checkRezada" onchange="toggleCurrent(this.checked)"> Marcar como rezada</label><div id="prayerBox" style="line-height:1.65"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="anterior()">Anterior</button><button class="btn btnY" onclick="siguiente()">Siguiente</button><button class="btn" onclick="hablarActual()">Escuchar</button></div></div></div></div><div class="bar"><button class="pauseBtn" id="pauseBtn" onclick="pausarGeneral()">PAUSAR SONIDO GENERAL</button><button class="playBtn" onclick="reanudarGeneral()">REANUDAR</button><button class="btnY" style="padding:12px 16px;border-radius:12px;font-weight:800;border:none" onclick="hablarActual()">HABLAR</button></div><script>const M={Gozosos:{d:"Lunes y Sabado",desc:"Alegria de Maria.",list:["La Anunciacion","La Visitacion","El Nacimiento","La Presentacion","El Nino perdido"]},Dolorosos:{d:"Martes y Viernes",desc:"Dolor de Jesus.",list:["La Agonia","La Flagelacion","La Coronacion","Jesus con la Cruz","La Crucifixion"]},Gloriosos:{d:"Miercoles y Domingo",desc:"Gloria.",list:["La Resurreccion","La Ascension","Espiritu Santo","La Asuncion","La Coronacion"]},Luminosos:{d:"Jueves",desc:"Luz.",list:["El Bautismo","Bodas de Cana","Anuncio del Reino","Transfiguracion","Eucaristia"]}};const DAYS=["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"];let tipo="Dolorosos",done=new Set(),currentId=null,beads=[],paused=false;function addBead(id,kind,sec,title,prayer,plain){beads.push({id,kind,sec,title,prayer,plain});}function build(){beads=[];addBead("cruz","cruz",1,"1) Senal de la Cruz y Credo","<b>SENAL DE LA CRUZ</b><br>Por la senal de la Santa Cruz, de nuestros enemigos, libranos Senor Dios nuestro. En el nombre del Padre y del Hijo y del Espiritu Santo. Amen.<br><br><b>CREDO</b><br>Creo en Dios Padre Todopoderoso, creador del cielo y de la tierra. Creo en Jesucristo, su unico Hijo, Nuestro Senor.","Por la senal de la Santa Cruz, libranos Senor Dios nuestro. Creo en Dios Padre Todopoderoso.");addBead("pf0","padre",2,"2) Padre Nuestro","<b>PADRE NUESTRO</b><br>Padre nuestro que estas en el cielo, santificado sea tu Nombre; venga a nosotros tu reino; hagase tu voluntad en la tierra como en el cielo. Danos hoy nuestro pan de cada dia; perdona nuestras ofensas, como tambien nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentacion, y libranos del mal. Amen.","Padre nuestro que estas en el cielo, santificado sea tu Nombre.");for(let i=1;i<=3;i++)addBead("av0-"+i,"ave",3,"3) Ave Maria "+i,"<b>AVE MARIA "+i+" de 3</b><br>Dios te salve, Maria, llena eres de gracia, el Senor es contigo. Bendita tu eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesus. Santa Maria, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amen.","Dios te salve, Maria, llena eres de gracia, el Senor es contigo.");addBead("gl0","padre",3,"Gloria","<b>GLORIA</b><br>Gloria al Padre, y al Hijo, y al Espiritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amen.","Gloria al Padre, y al Hijo, y al Espiritu Santo.");for(let m=0;m<5;m++){let sP=4+m*2,sA=5+m*2;addBead("pf"+m,"padre",sP,sP+") "+(m+1)+" Misterio","<b>"+(m+1)+" MISTERIO: "+M[tipo].list[m]+"</b><br><b>PADRE NUESTRO</b><br>Padre nuestro que estas en el cielo...",""+(m+1)+" Misterio: "+M[tipo].list[m]+". Padre nuestro que estas en el cielo.");for(let a=1;a<=10;a++)addBead("av"+m+"-"+a,"ave",sA,sA+") 10 Ave Marias","<b>"+(m+1)+" MISTERIO: "+M[tipo].list[m]+"</b><br><b>AVE MARIA "+a+" de 10</b><br>Dios te salve, Maria, llena eres de gracia, el Senor es contigo. Bendita tu eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesus. Santa Maria, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amen.","Ave Maria "+a+". Dios te salve, Maria, llena eres de gracia, el Senor es contigo.");addBead("gl"+m,"padre",sA,"Gloria","<b>GLORIA</b><br>Gloria al Padre, y al Hijo, y al Espiritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amen. Oh Jesus mio, perdona nuestros pecados, libranos del fuego del infierno.","Gloria al Padre, y al Hijo, y al Espiritu Santo. Oh Jesus mio, perdona nuestros pecados.");}beads=beads.filter(b=>!(b.id.startsWith("gl")&&b.id!=="gl0"));addBead("salve","cruz",14,"14) La Salve","<b>LA SALVE</b><br>Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve. A ti llamamos los desterrados hijos de Eva; a ti suspiramos, gimiendo y llorando, en este valle de lagrimas. Ea, pues, Senora, abogada nuestra, vuelve a nosotros esos tus ojos misericordiosos; y despues de este destierro muestranos a Jesus, fruto bendito de tu vientre. Oh clementisima, oh piadosa, oh dulce siempre Virgen Maria! Ruega por nosotros, Santa Madre de Dios. Amen.","Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve.");}function positions(){let c={};let loop=beads.slice(5,60);let tail=beads.slice(0,5).concat([beads[60]]);loop.forEach((b,i)=>{let ang=(-90+i*(360/loop.length))*Math.PI/180;c[b.id]={x:50+38*Math.cos(ang),y:38+30*Math.sin(ang)};});tail.forEach((b,i)=>{c[b.id]={x:50,y:68+i*5.2};});return c;}function render(){let coords=positions();let w=document.getElementById('rosWrap');let h='<div class="medal">+</div>';beads.forEach((b,i)=>{let cc=coords[b.id];if(!cc)return;let isNext=!done.has(b.id)&&(i===0||done.has(beads[i-1].id));let cls="bead "+b.kind+(done.has(b.id)?" done":"")+(isNext?" current":"");h+=`<div class="${cls}" data-id="${b.id}" style="left:${cc.x}%;top:${cc.y}%">${b.kind==="cruz"?"+":""}</div>`;});w.innerHTML=h;document.getElementById('cnt').textContent=done.size+" / "+beads.length+" ("+Math.round(done.size/beads.length*100)+"%)";document.getElementById('fill').style.width=(done.size/beads.length*100)+"%";w.querySelectorAll('.bead').forEach(el=>{let last=0;el.addEventListener('click',()=>{let now=Date.now();showBead(el.dataset.id);if(now-last<380)toggle(el.dataset.id);last=now;});});let cur=beads.find(b=>!done.has(b.id))||beads[beads.length-1];currentId=cur.id;showBead(cur.id,true);}function showBead(id,keep){currentId=id;let b=beads.find(x=>x.id===id);if(!b)return;document.getElementById('secTitle').textContent="Seccion "+b.sec+" de 14 - "+b.title;document.getElementById('prayerBox').innerHTML="<h3>"+b.title+"</h3>"+b.prayer;document.getElementById('checkRezada').checked=done.has(id);if(!keep&&document.getElementById('autoVoz').checked&&!paused)hablarActual();}function toggle(id){if(done.has(id))done.delete(id);else done.add(id);render();}function toggleCurrent(v){if(v)done.add(currentId);else done.delete(currentId);render();}function siguiente(){let n=beads.find(b=>!done.has(b.id));if(n)toggle(n.id);}function anterior(){let idx=beads.findIndex(b=>b.id===currentId);if(idx>0)showBead(beads[idx-1].id);}function reiniciar(){if(confirm("Empezar de nuevo?")){done=new Set();render();}}function getVoices(){let v=speechSynthesis.getVoices();let sel=document.getElementById('voiceSel');sel.innerHTML="";let es=v.filter(x=>x.lang.toLowerCase().includes('es'));let list=es.length?es:v;list.forEach(voice=>{let o=document.createElement('option');o.value=voice.name;o.textContent=voice.name+" ("+voice.lang+")";sel.appendChild(o);});}function hablarActual(){let b=beads.find(x=>x.id===currentId);if(!b||paused)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.plain);u.lang='es-CL';u.rate=parseFloat(document.getElementById('rateSel').value||1);let sel=document.getElementById('voiceSel');let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.name===sel.value);if(v)u.voice=v;speechSynthesis.speak(u);}function pausarGeneral(){paused=true;speechSynthesis.pause();document.getElementById('estadoVoz').textContent="PAUSADO";document.getElementById('pauseBtn').textContent="PAUSADO - Toca REANUDAR";}function reanudarGeneral(){paused=false;speechSynthesis.resume();document.getElementById('estadoVoz').textContent="Reanudado";document.getElementById('pauseBtn').textContent="PAUSAR SONIDO GENERAL";}function detenerVoz(){paused=false;speechSynthesis.cancel();}function setDia(idx){let map2=["Gozosos","Dolorosos","Gloriosos","Luminosos","Dolorosos","Gozosos","Gloriosos"];tipo=map2[idx];done=new Set();document.querySelectorAll('#days button').forEach((b,i)=>b.classList.toggle('sel',i===idx));document.getElementById('hoyTxt').textContent=M[tipo].d;document.getElementById('diaMsg').textContent=DAYS[idx]+": corresponde";document.getElementById('diaTipo').textContent="Misterios "+tipo;document.getElementById('diaDesc').textContent=M[tipo].desc;document.getElementById('misteriosList').innerHTML="<b>Los 5 misterios:</b><br>"+M[tipo].list.map((x,i)=>`${i+1} ${x}`).join("<br>");build();render();}document.getElementById('days').innerHTML=DAYS.map((d,i)=>`<button onclick="setDia(${i})">${d}</button>`).join("");let today=new Date();document.getElementById('fechaTop').textContent=today.toLocaleDateString('es-CL');if('speechSynthesis' in window){getVoices();speechSynthesis.onvoiceschanged=getVoices;}setDia(4);</script></body></html>
